<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时光阁 · S形时间轴照片墙</title>

<!--
  ════════════════════════════════════════════════════════════
  时光阁 · S形蜿蜒时间轴照片墙
  ────────────────────────────────────────────────────────────
  · 纯静态 HTML + CSS + 原生 JS，无后端、无第三方库，双击打开
  · 主线为一条连续 S 形平滑纵向曲线，从页面底部向上蜿蜒延伸
  · 时间节点顺序由下至上；圆形定位点精准落在 S 曲线上
  · 卡片沿曲线左右交替（右、左、右、左…循环）
  · 薄荷绿主题 · 深色背景 · 现代圆角风格

  如何新增节点 / 改文字 / 换图片：
    只改下方 <script> 里 DATA.ITEMS 数组，一行一个节点。
  ════════════════════════════════════════════════════════════
-->

<style>
/* ═══════════════════════════════════════════════════
   1. 全局基础
   ═══════════════════════════════════════════════════ */
:root {
  /* 薄荷绿主题 */
  --mint:        #3dddb4;   /* 主薄荷绿：曲线/圆点/高亮 */
  --mint-strong: #2ec39b;
  --mint-soft:   #1f6a57;   /* 边框薄荷绿 */
  --bg:          #0b1412;   /* 页面深色背景 */
  --card-bg:     #12201c;   /* 卡片深色底 */
  --card-bg-2:   #162b25;   /* 卡片渐变底 */
  --text:        #eaf6f2;   /* 正文浅白 */
  --text-dim:    #7fa094;   /* 次要文字 */
  --glow:        0 0 16px rgba(61,221,180,.25);
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior:smooth; }

body {
  background:
    radial-gradient(ellipse at 50% -10%, rgba(61,221,180,.10), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--mint); color: #06231b; }

/* ═══════════════════════════════════════════════════
   2. 页头
   ═══════════════════════════════════════════════════ */
.page-head {
  position: relative; z-index: 1;
  text-align: center;
  padding: 56px 20px 32px;
}
.page-head h1 {
  font-size: clamp(28px, 5vw, 46px);
  font-weight: 800;
  color: var(--text);
  letter-spacing: .08em;
}
.page-head h1 em { color: var(--mint); font-style: normal; }
.page-head .sub {
  margin-top: 10px;
  font-size: clamp(12px, 1.8vw, 14px);
  color: var(--text-dim);
  letter-spacing: .08em;
}
.page-head .scanline {
  width: min(240px, 50vw);
  height: 3px;
  margin: 18px auto 0;
  background: linear-gradient(90deg, transparent, var(--mint), transparent);
  border-radius: 3px;
  opacity: .7;
}

/* ═══════════════════════════════════════════════════
   3. 时间轴容器（曲线 + 节点）
   ═══════════════════════════════════════════════════ */
.timeline-wrap {
  position: relative; z-index: 1;
  max-width: 1080px;
  margin: 0 auto;
  padding: 24px 24px 60px;
}
.timeline {
  position: relative;
  /* 高度由 JS 按节点数计算并写入 style */
}

/* SVG 曲线层 */
.axis {
  position: absolute;
  left: 0; top: 0;
  pointer-events: none;
  overflow: visible;
}
.axis-path {
  fill: none;
  stroke: var(--mint);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .85;
  filter: drop-shadow(0 0 6px rgba(61,221,180,.35));
}

/* 节点（圆点 + 卡片），JS 生成 */
.node {
  position: absolute;
  z-index: 2;
}
.node .dot {
  position: absolute;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--mint);
  border: 4px solid var(--bg);
  box-shadow: 0 0 0 2px rgba(61,221,180,.45), var(--glow);
  z-index: 3;
}
.node .dot::after {
  content: ""; position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: #06231b;
}

/* ═══════════════════════════════════════════════════
   4. 时光卡片
   ═══════════════════════════════════════════════════ */
.card {
  position: absolute;
  background: linear-gradient(160deg, var(--card-bg-2), var(--card-bg));
  border: 1px solid var(--mint-soft);
  border-radius: 16px;
  padding: 12px;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.card:hover {
  border-color: var(--mint);
  transform: translateY(-3px);
  box-shadow: 0 14px 34px rgba(0,0,0,.4), var(--glow);
}

/* 卡片图片区 */
.card .img-box {
  position: relative;
  aspect-ratio: 4 / 3;
  border-radius: 10px;
  overflow: hidden;
  background: linear-gradient(135deg, #17352d, #11271f);
  border: 1px solid var(--mint-soft);
}
.card .img-box img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  cursor: zoom-in;
}
/* 空白模板：图片未填时的占位框 */
.card .img-placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  color: var(--text-dim);
  font-size: 12px;
  letter-spacing: .08em;
  border: 2px dashed var(--mint-soft);
  border-radius: 10px;
  margin: 0;
  cursor: pointer;
}
.card .img-placeholder::before {
  content: "[ 图片占位 ]";
  font-size: 13px;
  color: var(--mint);
  opacity: .75;
  letter-spacing: .1em;
}
.card .img-box:hover .img-placeholder { border-color: var(--mint); color: var(--mint); }

/* 卡片文字区 */
.card .body {
  padding: 12px 4px 4px;
}
.card .date {
  font-size: 12px;
  font-weight: 700;
  color: var(--mint);
  letter-spacing: .06em;
  margin-bottom: 8px;
}
.card .title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: .02em;
  line-height: 1.5;
  margin-bottom: 8px;
}
.card .desc {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.8;
}
/* 空文字占位提示 */
.card .date.empty::after { content: "日期"; color: var(--mint); opacity:.5; }
.card .title.empty::after { content: "标题"; color: var(--text-dim); }
.card .desc.empty::after  { content: "在此填写描述文字"; color: var(--text-dim); }

/* ═══════════════════════════════════════════════════
   5. 图片全屏放大弹窗
   ═══════════════════════════════════════════════════ */
.lightbox {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(3, 10, 8, .95);
  display: none;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 92vw;
  max-height: 88vh;
  object-fit: contain;
  border-radius: 8px;
  border: 1px solid var(--mint-soft);
  box-shadow: 0 0 60px rgba(61,221,180,.2);
  background: #000;
}
.lightbox .close-hint {
  position: absolute;
  bottom: 28px;
  left: 0; right: 0;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
  letter-spacing: .1em;
}

/* 页脚 */
.footer {
  position: relative; z-index: 1;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  letter-spacing: .12em;
  padding: 20px 20px 44px;
}

/* ═══════════════════════════════════════════════════
   6. 响应式
   ═══════════════════════════════════════════════════ */
@media (max-width: 720px) {
  .timeline-wrap { padding: 16px 12px 40px; }
  .page-head { padding: 36px 12px 22px; }
  .card { padding: 8px; border-radius: 12px; }
  .card .img-box { border-radius: 8px; }
  .card .body { padding: 10px 2px 2px; }
  .card .title { font-size: 15px; }
  .card .desc { font-size: 12px; line-height: 1.7; }
}
</style>
</head>
<body>

<header class="page-head">
  <h1>我的<em>时光阁</em></h1>
  <p class="sub">S形时光曲线 · 把锻炼的每一天收进这里</p>
  <div class="scanline"></div>
</header>

<main class="timeline-wrap">
  <!-- S形曲线 + 节点均由 JS 注入到 .timeline -->
  <div class="timeline" id="timeline"></div>
</main>

<div class="footer">◆ S形时光曲线 · 由下至上 ◆</div>

<!-- 全屏放大弹窗 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="放大预览">
  <div class="close-hint">点击任意处关闭 / ESC</div>
</div>

<script>
/* ════════════════════════════════════════════════════════
   A. 数据区（想改内容只改这里）
   ────────────────────────────────────────────────────────
   ITEMS 数组 = 时间节点，从下到上依次排布：
     ITEMS[0] 是曲线最底部（最早）的节点。
   每个节点的字段：
     date : 日期文案，如 "2026-08-01"
     title: 标题，如 "第 62 天"
     desc : 描述文字，如 "谢谢两个月前的自己"
     img  : 图片地址（本地路径或网络图），留空 "" 显示占位框
   · 想加节点：往数组里再加一个 {} 即可，曲线与交替自动适配
   · 想删节点：删掉对应一行即可
   ════════════════════════════════════════════════════════ */
var DATA = {
  ITEMS: [
    // 第 1 个节点：曲线最底部（最早）
    { date: "", title: "", desc: "", img: "" },
    { date: "", title: "", desc: "", img: "" },
    { date: "", title: "", desc: "", img: "" },
    { date: "", title: "", desc: "", img: "" },
    { date: "", title: "", desc: "", img: "" },
    { date: "", title: "", desc: "", img: "" },
  ]
};

/* ════════════════════════════════════════════════════════
   B. 布局参数（想调形态改这里）
   ────────────────────────────────────────────────────────
   NODE_SPACING : 相邻节点的纵向间距(px)，也是卡片密度
   WAVE_PERIOD  : S 曲线完整弯折次数（2 ≈ 两个 S）
   CARD_GAP     : 卡片边缘与圆点的间隙(px)
   ────────────────────────────────────────────────────────
   曲线振幅 A 会随屏幕宽度自动缩放（窄屏变小），无需手动改。
   ════════════════════════════════════════════════════════ */
var CONFIG = {
  NODE_SPACING: 360,
  WAVE_PERIOD: 2,
  CARD_GAP: 24,
  MIN_CARD_W: 220,       // 卡片最小宽度
  MAX_CARD_W: 300,       // 卡片最大宽度（桌面）
  TOP_PAD: 40,           // 曲线顶部留白
  BOTTOM_PAD: 40,        // 曲线底部留白
};

/* ════════════════════════════════════════════════════════
   C. 渲染引擎（一般无需改动）
   ════════════════════════════════════════════════════════ */
var timelineEl  = document.getElementById('timeline');
var lightbox    = document.getElementById('lightbox');
var lightboxImg = document.getElementById('lightbox-img');

/* S 曲线 x 坐标：给定纵向 y(px, 从顶部起算) 与整条线高度，
   返回该高度处曲线应处的 x（正弦波 = 连续 S 形） */
function waveX(y, height, width) {
  var t = y / height;               // 0(顶) → 1(底)
  var amp = Math.min(width * 0.16, 110);   // 振幅随屏宽缩放
  return width / 2 + amp * Math.sin(t * Math.PI * 2 * CONFIG.WAVE_PERIOD);
}

/* 生成整条 S 曲线 SVG path（点足够密 → 视觉平滑） */
function buildAxisPath(width, height) {
  var d = "", step = 4;
  for (var y = 0; y <= height; y += step) {
    var x = waveX(y, height, width);
    d += (d ? " L " : "M ") + x.toFixed(1) + " " + y.toFixed(1);
  }
  return d;
}

/* 根据屏幕宽度计算卡片宽度 */
function cardWidth(width) {
  var w = Math.min(CONFIG.MAX_CARD_W, Math.max(CONFIG.MIN_CARD_W, width * 0.32));
  if (width < 480) w = Math.min(CONFIG.MIN_CARD_W, width * 0.62);
  return w;
}

function render() {
  var items = DATA.ITEMS;
  if (!items.length) return;

  var width = timelineEl.clientWidth || 760;
  var spacing = Math.max(260, CONFIG.NODE_SPACING * (width / 1080));
  var cw = cardWidth(width);

  var height = CONFIG.TOP_PAD + CONFIG.BOTTOM_PAD + spacing * items.length;
  var baseY = height - CONFIG.BOTTOM_PAD - spacing / 2; // 底部第一个节点中心 y

  timelineEl.style.height = height + "px";

  /* ── 1. S 形曲线 ── */
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "axis");
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("class", "axis-path");
  path.setAttribute("d", buildAxisPath(width, height));
  svg.appendChild(path);
  timelineEl.innerHTML = "";
  timelineEl.appendChild(svg);

  /* ── 2. 节点（圆点精准骑线 + 卡片左右交替） ── */
  var placed = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var nodeY = baseY - i * spacing;          // 底部→顶部
    var nodeX = waveX(nodeY, height, width);  // 节点圆心在 S 曲线上
    var onRight = (i % 2 === 0);              // 0→右, 1→左, 交替

    /* 卡片元素 */
    var card = document.createElement("div");
    card.className = "card";
    card.style.width = cw + "px";

    var imgBox = document.createElement("div");
    imgBox.className = "img-box";
    if (it.img) {
      var im = document.createElement("img");
      im.src = it.img;
      im.alt = it.title || "时光照片";
      im.loading = "lazy";
      im.addEventListener("click", function (e) {
        e.stopPropagation();
        openLightbox(this.src);
      });
      imgBox.appendChild(im);
    } else {
      var ph = document.createElement("div");
      ph.className = "img-placeholder";
      ph.textContent = "点击替换图片";
      ph.addEventListener("click", function (e) {
        e.stopPropagation();
        alert("空白模板：在 DATA.ITEMS 里给 img 填入图片地址即可。");
      });
      imgBox.appendChild(ph);
    }
    card.appendChild(imgBox);

    var body = document.createElement("div");
    body.className = "body";
    var date = document.createElement("div");
    date.className = "date" + (it.date ? "" : " empty");
    date.textContent = it.date || "";
    var title = document.createElement("div");
    title.className = "title" + (it.title ? "" : " empty");
    title.textContent = it.title || "";
    var desc = document.createElement("div");
    desc.className = "desc" + (it.desc ? "" : " empty");
    desc.textContent = it.desc || "";
    body.appendChild(date);
    body.appendChild(title);
    body.appendChild(desc);
    card.appendChild(body);

    /* 卡片水平定位：交替 + 边界夹取，保证不溢出屏幕 */
    var left;
    if (onRight) {
      left = Math.min(nodeX + CONFIG.CARD_GAP, width - cw - 6);   // 节点右侧
    } else {
      left = Math.max(nodeX - CONFIG.CARD_GAP - cw, 6);           // 节点左侧
    }
    card.style.left = left + "px";

    /* 节点圆点 */
    var node = document.createElement("div");
    node.className = "node";
    node.style.left = (nodeX - 9) + "px";
    node.style.top = (nodeY - 9) + "px";
    var dot = document.createElement("div");
    dot.className = "dot";
    node.appendChild(dot);
    node.appendChild(card);

    timelineEl.appendChild(node);

    placed.push({ node: node, card: card, y: nodeY });
  }

  /* 卡片垂直居中于节点：等渲染后量卡片实际高度再定位 */
  requestAnimationFrame(function align() {
    for (var j = 0; j < placed.length; j++) {
      var h = placed[j].card.offsetHeight || 0;
      placed[j].card.style.top = (placed[j].y - h / 2) + "px";
    }
  });
}

/* ════════════════════════════════════════════════════════
   D. 图片弹窗
   ════════════════════════════════════════════════════════ */
function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add("open");
}
function closeLightbox() {
  lightbox.classList.remove("open");
  lightboxImg.src = "";
}
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeLightbox();
});

/* ── 初始化 + 防抖 resize 重算 ── */
var resizeTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});

render();
</script>
</body>
</html>
